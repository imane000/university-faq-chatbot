name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest -q
      - run: python scripts/check_repository.py --history
      # Four server-side Chroma advisories have no published fix. This app uses
      # embedded PersistentClient only; see docs/SECURITY.md for scope and rationale.
      - name: Audit Python dependencies (documented local-only exceptions)
        run: >-
          pip-audit --progress-spinner off
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815 --ignore-vuln PYSEC-2026-3813
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit
